# ═══════════════════════════════════════════════════════════════════════════
#  NIXPACKS — Dulce Encanto (Railway deploy config)
# ═══════════════════════════════════════════════════════════════════════════
#  Railway usa este archivo para construir y desplegar la app.
#
#  PASOS EN RAILWAY:
#  1. Sube el código a GitHub
#  2. Railway: New Project > Deploy from GitHub repo
#  3. Add > Database > MySQL (Railway genera DATABASE_URL automáticamente)
#  4. En el servicio WEB, ve a Variables > Reference Variables
#     y selecciona DATABASE_URL del MySQL service
#  5. Agregar variables: JWT_SECRET y NODE_ENV=production
#  6. Deploy
# ═══════════════════════════════════════════════════════════════════════════

[phases.setup]
nixPkgs = ['bun', 'openssl', 'nodejs']

[phases.install]
cmds = [
  'bun install',
]

[phases.build]
cmds = [
  # Generar Prisma Client
  'bun run db:generate',
  # Crear tablas en MySQL (usa DATABASE_URL de Railway)
  'bun run db:push',
  # Sembrar datos iniciales (solo si la BD está vacía; para forzar: FORCE_SEED=1)
  'bun run scripts/seed-dulce.ts',
  'bun run scripts/seed-extras.ts',
  'bun run scripts/seed-catalog.ts',
  # Build de producción
  'bun run build',
]

[start]
cmd = 'node .next/standalone/server.js'

# ═══════════════════════════════════════════════════════════════════════════
#  VARIABLES DE ENTORNO REQUERIDAS EN RAILWAY:
# ═══════════════════════════════════════════════════════════════════════════
#
#  DATABASE_URL → Click en "Reference Variables" y selecciona la del MySQL addon
#                 (formato: mysql://root:pass@host:port/railway)
#
#  JWT_SECRET   → Generar con: openssl rand -hex 32
#
#  NODE_ENV     → production
#
#  ══════════════════════════════════════════════════════════════════════
#  ⚠️ IMPORTANTE: Railway crea 2 servicios separados:
#  1. MySQL (la base de datos)
#  2. Web (la aplicación Next.js)
#
#  Debes "referenciar" las variables del MySQL en el servicio Web:
#  Web service > Variables > New Variable > Name: DATABASE_URL
#  > Value: ${MySQL.DATABASE_URL}  (click "Reference Variable")
#  ══════════════════════════════════════════════════════════════════════
