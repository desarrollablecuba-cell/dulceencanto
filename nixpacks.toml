# ═══════════════════════════════════════════════════════════════════════════
#  NIXPACKS — Dulce Encanto (Railway deploy config)
# ═══════════════════════════════════════════════════════════════════════════
#  Railway usa este archivo para construir y desplegar la app.
#
#  ⚠️ LECCIÓN APRENDIDA (importante):
#  El contenedor de BUILD de Railway NO tiene acceso a la red privada
#  (mysql.railway.internal). Por eso `prisma db push` y los seeds NO se
#  ejecutan en la fase de build — fallarían con "Can't reach database
#  server" y romperían el deploy.
#
#  La preparación de la BD (crear tablas + sembrar datos) se hace en el
#  ARRANQUE del servidor (scripts/start-railway.mjs), donde SÍ hay red
#  privada. En el primer arranque tarda ~1-2 min extra; en los siguientes
#  es casi instantáneo (todo se auto-omite si ya está hecho).
#
#  PASOS EN RAILWAY:
#  1. Sube el código a GitHub
#  2. Railway: New Project > Deploy from GitHub repo
#  3. Add > Database > MySQL
#  4. En el servicio WEB, ve a Variables > Reference Variables y selecciona
#     DATABASE_URL del servicio MySQL
#  5. Agregar variables: JWT_SECRET y NODE_ENV=production
#  6. Deploy
# ═══════════════════════════════════════════════════════════════════════════

[phases.setup]
nixPkgs = ['nodejs', 'openssl']

[phases.install]
cmds = [
  # --include=dev es OBLIGATORIO: con NODE_ENV=production npm omite las
  # devDependencies, y typescript/tsx/prisma-related se necesitan para
  # compilar y arrancar.
  'npm install --include=dev --no-audit --no-fund',
]

[phases.build]
cmds = [
  # Generar Prisma Client (sin tocar la BD)
  'npx prisma generate',
  # Build de producción (next build + copia de static/public/data)
  'npm run build',
]

[start]
# Prepara la BD (tablas + seeds con reintentos) y luego arranca el server.
# Ver scripts/start-railway.mjs para el detalle completo.
cmd = 'node scripts/start-railway.mjs'

# ═══════════════════════════════════════════════════════════════════════
#  VARIABLES DE ENTORNO REQUERIDAS EN EL SERVICIO WEB:
#
#  DATABASE_URL → "Reference Variable" de la BD MySQL
#                 (formato: mysql://root:pass@mysql.railway.internal:3306/railway)
#
#  JWT_SECRET   → Generar con: openssl rand -hex 32
#
#  NODE_ENV     → production
#
#  FORCE_SEED   → (opcional) 1 = forzar resiembra completa. ¡Quitar después!
# ═══════════════════════════════════════════════════════════════════════
